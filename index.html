<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora ASTM C293</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold text-center mb-6 text-blue-700">Módulo de Rotura (ASTM C293)</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Carga Máxima (P) [kN]</label>
                <input type="number" id="cargaP" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500" placeholder="Ej: 19.6">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ancho (b) [cm]</label>
                    <input type="number" id="anchoB" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500" placeholder="Ej: 15">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Altura (d) [cm]</label>
                    <input type="number" id="alturaD" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500" placeholder="Ej: 15">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Longitud de claro (L) [cm]</label>
                <input type="number" id="luzL" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500" placeholder="Ej: 45">
            </div>

            <hr class="my-4">

            <div>
                <label class="block text-sm font-medium text-gray-700 text-blue-600">Resistencia de diseño f'c [kgf/cm²] (Opcional)</label>
                <input type="number" id="fcDiseno" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500" placeholder="Ej: 400">
            </div>

            <button onclick="calcularModulo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                Calcular y Evaluar
            </button>
        </div>

        <div id="resultadoCaja" class="mt-6 hidden bg-gray-50 p-4 rounded-lg border border-gray-200 text-center">
            <p class="text-sm text-gray-500">Módulo de Rotura Experimental (R)</p>
            <p id="resultadoKgf" class="text-3xl font-bold text-gray-800"></p>
            <p id="resultadoMpa" class="text-lg text-gray-600 mb-4"></p>
            
            <div id="evaluacionCaja" class="hidden border-t pt-4">
                <p class="text-sm text-gray-500">Módulo de Rotura Teórico (2√f'c)</p>
                <p id="resultadoTeorico" class="text-lg font-semibold text-gray-700 mb-2"></p>
                <div id="badgeEstado" class="inline-block px-4 py-2 rounded-full text-sm font-bold text-white"></div>
            </div>
        </div>
    </div>

    <script>
        function calcularModulo() {
            const P_kn = parseFloat(document.getElementById('cargaP').value);
            const b = parseFloat(document.getElementById('anchoB').value);
            const d = parseFloat(document.getElementById('alturaD').value);
            const L = parseFloat(document.getElementById('luzL').value);
            const fc = parseFloat(document.getElementById('fcDiseno').value);

            if (!P_kn || !b || !d || !L) {
                alert('Por favor ingrese los datos de la carga y las dimensiones de la probeta.');
                return;
            }

            // Conversión estricta de kN a kgf
            const P_kgf = P_kn * 101.9716;

            // Fórmula ASTM C293: R = 3PL / 2bd²
            const R_kgf = (3 * P_kgf * L) / (2 * b * Math.pow(d, 2));
            const R_mpa = R_kgf * 0.0980665; // Conversión estricta a MPa

            document.getElementById('resultadoKgf').innerText = R_kgf.toFixed(2) + ' kgf/cm²';
            document.getElementById('resultadoMpa').innerText = R_mpa.toFixed(2) + ' MPa';
            
            const evaluacionCaja = document.getElementById('evaluacionCaja');
            const badgeEstado = document.getElementById('badgeEstado');

            if (fc) {
                const R_teorico = 2 * Math.sqrt(fc);
                document.getElementById('resultadoTeorico').innerText = R_teorico.toFixed(2) + ' kgf/cm²';
                
                // Lógica de aceptación
                badgeEstado.classList.remove('bg-green-500', 'bg-yellow-500', 'bg-red-500');
                
                if (R_kgf >= R_teorico) {
                    badgeEstado.innerText = 'CUMPLE';
                    badgeEstado.classList.add('bg-green-500');
                } else if (R_kgf >= (R_teorico - 3.5)) {
                    badgeEstado.innerText = 'CUMPLE (Dentro de tolerancia 3.5 kgf/cm²)';
                    badgeEstado.classList.add('bg-yellow-500');
                } else {
                    badgeEstado.innerText = 'NO CUMPLE (Observado)';
                    badgeEstado.classList.add('bg-red-500');
                }
                evaluacionCaja.classList.remove('hidden');
            } else {
                evaluacionCaja.classList.add('hidden');
            }

            document.getElementById('resultadoCaja').classList.remove('hidden');
        }
    </script>
</body>
</html>
